##################
# Rebase Scripts #
##################

run_rebase:
  # We place this in pre_build_check so that it appears on the left in the UI, and
  # so that the rebase jobs can depend on it
  stage: pre-flight
  script: echo Will run rebase if required
  variables:
    GIT_STRATEGY: none
    EKS_SIZE: small
  extends:
    - .linux_runner
  rules:
    - if: $CI_PIPELINE_SOURCE != 'merge_request_event'
      when: manual
      # See https://forum.gitlab.com/t/specifying-a-pipeline-step-as-manual-causes-its-status-to-always-be-blocked/58333/3
      allow_failure: true

.perform_rebase:
  variables:
    GIT_SUBMODULE_STRATEGY: normal
  script:
    - if [ ! -d regression_test/output ]; then echo "Not triggering rebase as no output has been found" && exit 0; fi
    # Use tetra and do the rebase
    - pip install -e tetra
    - $PYTHON tetra/tetra/update_reference_data.py regression_test --update_refs
    - cd regression_test
    - $PYTHON -m unittest test_compare_platforms
        || (echo "Can't rebase since platforms do not compare equal" && false)
    # Create a new branch if required
    - git add ref
    - git ${REBASE_USER_ID} commit -m "Update regression test references" -m "${CI_PIPELINE_URL}" # $USER_ID sets --author from secrets
    # Authenticate the -ci user with a masked CI access token without persisting it in .git/config.
    - git push "https://oauth2:${OFAN_TESTER_TOKEN}@git.oxfordnanolabs.local/machine-learning/dorado.git" HEAD:${CI_COMMIT_REF_NAME}
  artifacts:
    when: always
    paths:
      - regression_test/output
    expire_in: 7 days

rebase_dorado:
  image: ${DORADO_DOCKER_ROOT}/dorado-24.04-cuda-${CUDA}.0:1.1
  variables:
    ONT_PYTHON_URL: ${ONT_PYTHON_URL_PREFIX}/${ONT_PYTHON_FILENAME_LINUX_X86_313}
    EKS_SIZE: small
  stage: rebase
  interruptible: false
  needs:
    - regression_test:linux:x86:cuda12:a100
    - regression_test:linux:x86:cuda12:v100
    - regression_test:linux:arm64:jammy
    - regression_test:macos:arm
    - regression_test:windows:5070ti
    - regression_test:windows:v100
    - run_rebase
  extends:
    - .linux_runner
    - .linux_regression_dependencies
    - .perform_rebase
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_failure
