################
# Dependencies #
################

.linux_regression_dependencies:
  before_script:
    - !reference [.create_venv]
    - !reference [.linux_run_git_lfs]
    - export LD_LIBRARY_PATH=${LD_LIBRARY_PATH}:${PWD}/lib
    - pip install pysam "--only-binary=:all:"

.windows_regression_dependencies:
  before_script:
    - export ROOT_DIR=$PWD
    - !reference [.create_venv]
    - export CURL_SSL_BACKEND="schannel"
    - pip install psutil

.macos_regression_dependencies:
  before_script:
    - !reference [.create_venv]
    - export ROOT_DIR=$PWD
    # We need to add the build:osx:/lib folder to the dylib path for libbasecall_client.dylib
    - export DYLD_FALLBACK_LIBRARY_PATH=${PWD}/lib
    - pip install psutil
    - pip install pysam "--only-binary=:all:"

.macos_arm_regression_runner:
  tags:
    - osx_arm64
    - on-prem
    # Modbase regression results depend on the MPS version which depends on the OS version,
    # so pin the OS to the one that we have the most runners of.
    - osx-15.5

.macos_arm_regression_speed_runner:
  tags:
    - osx_arm64
    - on-prem
    # We need to pin to an OS and GPU for consistent speeds.
    - osx-15.5
    - m4

.linux_regression_runner_v100:
  tags:
    - ubuntu-20.04
    - nvidia-docker
    - on-prem
    - gpu-v100

.linux_regression_runner_a100:
  tags:
    - ubuntu-24.04
    - nvidia-docker
    - on-prem
    - gpu-a100

.windows_regression_runner_v100:
  tags:
    - windows
    - cuda-${CUDA}
    - on-prem
    - gpu-v100

.windows_regression_runner_a6000:
  tags:
    - windows
    - cuda-${CUDA}
    - on-prem
    - gpu-a6000

.windows_regression_runner_5070ti:
  tags:
    - windows
    - cuda-${CUDA}
    - on-prem
    - gpu-5070ti

.linux_benchmark_runner_p48:
